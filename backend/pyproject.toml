[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-gerador-dados"
version = "0.0.0"
description = "Analisador e Gerador de Dados — API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "plotly>=5.24",
  "openpyxl>=3.1",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "complexipy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "W", "I", "N", "UP", "B", "C4", "C90", "SIM", "RET",
  "PL", "PLR1702", "PERF", "RUF", "PT", "ARG", "ERA", "TID",
]
# Símbolos matemáticos (×, −, σ) são intencionais em textos e docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 40
max-nested-blocks = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
